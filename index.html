<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spor Programı</title><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#0b4dbb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spor"><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#111827;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}header{background:linear-gradient(135deg,#073c94,#0b63da);color:#fff;padding:22px 16px 26px;border-radius:0 0 26px 26px}.wrap{max-width:900px;margin:auto;padding:0 14px}h1{margin:0;font-size:28px}.sub{opacity:.9}.tabs,.days{display:flex;gap:8px;overflow:auto;padding:12px 0}.btn{border:1px solid #dbe7f7;background:#fff;border-radius:999px;padding:10px 13px;font-weight:800;white-space:nowrap}.on,.btn.active{background:#0b4dbb;color:#fff}.card{background:#fff;border:1px solid #dbe7f7;border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 8px 24px #0f4fb81a}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.muted{color:#667085;font-size:13px}.pill{background:#eaf2ff;color:#0b4dbb;border-radius:999px;padding:7px 10px;font-weight:900;font-size:12px;display:inline-block}.barbox{height:12px;background:#e5edf8;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:linear-gradient(90deg,#0b4dbb,#22c55e);width:0}.ex{display:grid;grid-template-columns:1fr;gap:12px}.head{display:flex;gap:12px}.num{min-width:34px;height:34px;border-radius:12px;background:#0b4dbb;color:#fff;display:grid;place-items:center;font-weight:900}.ttl{margin:0;font-size:17px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.note{font-size:14px;line-height:1.45}.alt{font-size:13px;color:#667085}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.set{border:1px solid #dbe7f7;background:#f8fbff;border-radius:13px;padding:10px 6px;font-weight:900}.done{background:#dcfce7;border-color:#86efac;color:#166534}.pic{background:linear-gradient(180deg,#f8fbff,#eef5ff);border:1px solid #dbe7f7;border-radius:18px;padding:10px;text-align:center}.pic svg{width:100%;max-width:230px}.cap{font-size:12px;color:#0b4dbb;font-weight:900}main{padding-bottom:126px}#dock{position:fixed;left:12px;right:12px;bottom:12px;background:#fffffff2;border:1px solid #dbe7f7;border-radius:24px;padding:14px;box-shadow:0 8px 24px #0f4fb82a;z-index:10}.time{font-size:38px;font-weight:1000;color:#0b4dbb}.actions{display:flex;gap:8px;flex-wrap:wrap}.mini{padding:9px 12px;font-size:13px}@media(min-width:760px){.ex{grid-template-columns:1.4fr .8fr}.sets{grid-template-columns:repeat(6,1fr)}}</style></head><body><header><div class="wrap"><h1>Bölgesel Antrenman Programı</h1><div class="sub">Hareket görselleri • set takibi • dinlenme kronometresi</div></div></header><div class="wrap"><div class="tabs"><button id="m4" class="btn active">4 Gün</button><button id="m5" class="btn">5 Gün</button><button id="reset" class="btn">Bugünü Sıfırla</button></div><div id="days" class="days"></div><main><section class="card"><div class="row"><div><span class="pill">Yağ yakımı + kas koruma</span><h2 id="title"></h2><div id="sub" class="muted"></div></div><div><div class="muted">İlerleme</div><div id="pct" style="font-size:28px;font-weight:900;color:#0b4dbb">0%</div></div></div><div class="barbox"><div id="bar" class="bar"></div></div></section><section class="card"><b>Kullanım:</b><div class="muted">Set butonuna basınca set tamamlanır ve hareketin dinlenme süresi otomatik başlar. Alttan 60/90/120 sn manuel başlatabilirsin.</div></section><section id="list"></section></main></div><div id="dock"><div class="row"><div><div id="label" class="muted">Dinlenme kronometresi</div><div id="time" class="time">00:00</div></div><span id="state" class="pill">Hazır</span></div><div class="actions"><button class="btn mini on" onclick="startRest(60)">60 sn</button><button class="btn mini on" onclick="startRest(90)">90 sn</button><button class="btn mini on" onclick="startRest(120)">120 sn</button><button class="btn mini" onclick="pauseRest()">Duraklat/Devam</button><button class="btn mini" onclick="clearRest()">Sıfırla</button></div></div><script>const D=[['Gün 1','Göğüs + Triceps','70-90 dk',[['Incline Chest Press','4 x 10-12','Omuzları aşağıda tut, göğsü aç, kontrollü it.','Incline DB Press / Smith Press',90,4,'press'],['Flat DB Press','3 x 10-12','Dirsekleri kontrollü indir, göğüste esneme hisset.','Machine Chest Press / Push-up',90,3,'press'],['Cable Fly','3 x 12-15','Kollar hafif kırık, önde 1 sn sık.','Pec Deck / DB Fly',60,3,'fly'],['Triceps Pushdown','4 x 10-12','Dirsek sabit, omuz oynatma.','Straight Bar / Tek Kol Pushdown',60,4,'tri'],['Overhead Triceps','3 x 12-15','Baş üstünden kontrollü aç-kapat.','DB Overhead / Skull Crusher',60,3,'tri'],['Eğimli Yürüyüş','15-20 dk','Hız 4.5-5.5, eğim 4-7.','Bisiklet / Eliptik',0,1,'cardio']]],['Gün 2','Sırt + Biceps','70-90 dk',[['Lat Pulldown','4 x 10-12','Barı göğse çek, kürek kemiklerini aşağı indir.','Assisted Pull-up / Band Pulldown',90,4,'pull'],['Seated Cable Row','4 x 10-12','Belini yuvarlama, çekiş sonunda sırtı sık.','Chest Supported Row / DB Row',90,4,'row'],['Chest Supported Row','3 x 10-12','Göğsü desteğe yasla, sırtla çek.','One-arm DB Row / T-Bar Row',90,3,'row'],['Straight Arm Pulldown','3 x 12-15','Dirsek hafif kırık, kanatları kullan.','DB Pullover / Band Pulldown',60,3,'pull'],['Face Pull','3 x 15','Halatı yüze çek, dirsekleri dışarı aç.','Reverse Pec Deck / Rear Delt Fly',60,3,'pull'],['DB Biceps Curl','3 x 10-12','Vücudu sallama, kontrollü kaldır-indir.','Barbell Curl / Cable Curl',60,3,'curl'],['Hammer Curl','3 x 12','Avuç içleri birbirine baksın.','Rope Hammer / Cross-body Curl',60,3,'curl'],['Eğimli Yürüyüş','15-25 dk','Hız 4.5-5.5, eğim 4-8.','Bisiklet / Eliptik',0,1,'cardio']]],['Gün 3','Bacak + Karın','75-90 dk',[['Leg Press','4 x 10-12','Dizleri içeri kapatma, belini pedden kaldırma.','Goblet Squat / Smith Squat',120,4,'leg'],['Seated Leg Curl','4 x 12-15','Arka bacağı sık, ağırlığı savurma.','Lying Leg Curl / RDL',75,4,'leg'],['Leg Extension','3 x 12-15','Yukarıda kısa sık, dizleri kilitleme.','Split Squat / Bodyweight Squat',75,3,'leg'],['Goblet Squat','3 x 10-12','Göğüs dik, dizler ayak yönüne gitsin.','Smith Squat / Box Squat',90,3,'leg'],['Calf Raise','4 x 12-20','Yukarıda 1 sn sık, aşağıda esnet.','Seated Calf / Step Calf',60,4,'leg'],['Cable Crunch','3 x 12-15','Belden değil karından bükül.','Crunch Machine / Floor Crunch',45,3,'abs'],['Plank','3 x 25-45 sn','Kalçayı ne düşür ne yükselt.','Dead Bug / Knee Plank',45,3,'abs'],['Hafif Kardiyo','10-15 dk','Orta tempo yürüyüş.','Bisiklet / Eliptik',0,1,'cardio']]],['Gün 4','Omuz + Kol','70-90 dk',[['Shoulder Press','4 x 10-12','Belini aşırı çukurlaştırma, kontrollü it.','DB Shoulder Press',90,4,'press'],['Lateral Raise','4 x 12-15','Boynu kasma, omuz hizasına kaldır.','Cable Lateral Raise',60,4,'fly'],['Cable Lateral Raise','3 x 12-15','Hareketi savurma, yan omuzu hisset.','Machine Lateral Raise',60,3,'fly'],['Reverse Pec Deck','3 x 12-15','Arka omuzu sık, gövdeyi sabit tut.','Rear Delt Fly / Face Pull',60,3,'pull'],['EZ Bar Curl','3 x 10-12','Dirsek sabit, kontrollü kaldır-indir.','Cable Curl / DB Curl',60,3,'curl'],['Rope Hammer Curl','3 x 12-15','Nötr tutuşu koru.','DB Hammer Curl',60,3,'curl'],['Triceps Pushdown','3 x 12','Aşağıda tricepsi sık.','Tek Kol Pushdown',60,3,'tri'],['Overhead Triceps','3 x 12-15','Baş üstünden kontrollü aç-kapat.','DB Overhead',60,3,'tri'],['Kardiyo','25-35 dk','Hız 4.5-5.5, eğim 5-8.','Bisiklet / Eliptik',0,1,'cardio']]],['Gün 5','Opsiyonel Hafif Gün','60-80 dk',[['Chest Press','3 x 12','Kontrollü it, göğsü sık.','Push-up / DB Press',75,3,'press'],['Lat Pulldown','3 x 12','Barı göğse çek.','One-arm Row / Band Pulldown',75,3,'pull'],['Leg Press','3 x 12','Diz kontrolünü koru.','Goblet Squat / Smith Squat',90,3,'leg'],['Lateral Raise','3 x 15','Hafif kilo ile temiz tekrar.','Cable Lateral Raise',60,3,'fly'],['Cable Curl','2 x 12','Dirsek sabit, yavaş indir.','DB Curl / EZ Curl',60,2,'curl'],['Triceps Pushdown','2 x 12','Omuz oynatma.','Overhead Extension',60,2,'tri'],['Uzun Kardiyo','30-40 dk','Eğimli yürüyüş.','Eliptik / Kürek',0,1,'cardio']]]];let mode=localStorage.mode||'4',day=+(localStorage.day||0),T=null,left=0,pause=false;const $=x=>document.getElementById(x),K=(i,j)=>'s_'+day+'_'+i+'_'+j;function f(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function img(k,n){let a='M75 65 L50 90 M75 65 L100 90';if(k==='press')a='M75 65 L48 38 M75 65 L102 38';if(k==='pull')a='M75 65 L45 32 M75 65 L105 32';if(k==='row')a='M75 70 L118 78 M75 78 L118 98';if(k==='fly')a='M75 65 L35 68 M75 65 L115 68';if(k==='tri')a='M75 65 L118 76 M118 76 L118 112';if(k==='curl')a='M75 68 L54 96 M75 68 L96 96';if(k==='leg')a='M75 95 L52 125 M75 95 L110 125';if(k==='abs')a='M45 82 L88 90 L130 96 M35 105 L140 105';if(k==='cardio')return '<div class="pic"><svg viewBox="0 0 160 130"><rect width="160" height="130" rx="18" fill="#f8fbff"/><g stroke="#111827" stroke-width="5" stroke-linecap="round" fill="none"><path d="M30 92 L60 62 L118 62 L136 92"/><rect x="34" y="94" width="100" height="10" rx="5" fill="#cfe1ff" stroke="none"/><circle cx="78" cy="40" r="10" fill="#0b4dbb" stroke="none"/><path d="M78 52 L94 78 M94 78 L118 78 M94 78 L82 108 M118 78 L126 108"/></g></svg><div class="cap">'+n+'</div></div>';return '<div class="pic"><svg viewBox="0 0 160 130"><rect width="160" height="130" rx="18" fill="#f8fbff"/><g stroke="#111827" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="75" cy="40" r="11" fill="#0b4dbb" stroke="none"/><path d="M75 53 L75 95 M75 95 L56 124 M75 95 L98 124"/><path d="'+a+'"/><rect x="126" y="22" width="12" height="96" rx="5" opacity=".35"/></g></svg><div class="cap">'+n+'</div></div>'}function renderDays(){let n=mode==='5'?5:4;if(day>=n)day=0;$('days').innerHTML='';D.slice(0,n).forEach((x,i)=>{let b=document.createElement('button');b.className='btn '+(i===day?'active':'');b.textContent=x[0]+' • '+x[1];b.onclick=()=>{day=i;localStorage.day=day;render()};$('days').appendChild(b)})}function render(){renderDays();let c=D[day];$('title').textContent=c[0]+' — '+c[1];$('sub').textContent='Süre: '+c[2];let h='';c[3].forEach((e,i)=>{let ss='';for(let j=0;j<e[5];j++){let d=localStorage.getItem(K(i,j))==='1';ss+='<button class="set '+(d?'done':'')+'" onclick="done('+i+','+j+','+e[4]+')">Set '+(j+1)+'</button>'}h+='<article class="card ex"><div><div class="head"><div class="num">'+(i+1)+'</div><div><h3 class="ttl">'+e[0]+'</h3><div class="meta"><span class="pill">'+e[1]+'</span><span class="pill">'+(e[4]?e[4]+' sn':'kardiyo')+'</span></div><div class="note">'+e[2]+'</div><div class="alt"><b>Alternatif:</b> '+e[3]+'</div></div></div><div class="sets">'+ss+'</div></div>'+img(e[6],e[0])+'</article>'});$('list').innerHTML=h;prog()}window.done=(i,j,sec)=>{let k=K(i,j);localStorage.setItem(k,localStorage.getItem(k)==='1'?'0':'1');if(sec)startRest(sec);render()};function prog(){let t=0,d=0;D[day][3].forEach((e,i)=>{for(let j=0;j<e[5];j++){t++;if(localStorage.getItem(K(i,j))==='1')d++}});let p=t?Math.round(d*100/t):0;$('pct').textContent=p+'%';$('bar').style.width=p+'%'}window.startRest=s=>{if(T)clearInterval(T);left=s;pause=false;$('state').textContent='Çalışıyor';tick();T=setInterval(()=>{if(pause)return;left--;tick();if(left<=0){clearInterval(T);T=null;$('state').textContent='Bitti';navigator.vibrate&&navigator.vibrate([250,120,250])}},1000)};function tick(){$('time').textContent=f(Math.max(0,left))}window.pauseRest=()=>{if(T){pause=!pause;$('state').textContent=pause?'Duraklatıldı':'Çalışıyor'}};window.clearRest=()=>{if(T)clearInterval(T);T=null;left=0;pause=false;$('state').textContent='Hazır';tick()};$('m4').onclick=()=>{mode='4';localStorage.mode=mode;$('m4').classList.add('active');$('m5').classList.remove('active');render()};$('m5').onclick=()=>{mode='5';localStorage.mode=mode;$('m5').classList.add('active');$('m4').classList.remove('active');render()};$('reset').onclick=()=>{D[day][3].forEach((e,i)=>{for(let j=0;j<e[5];j++)localStorage.removeItem(K(i,j))});render()};if(mode==='5'){$('m5').classList.add('active');$('m4').classList.remove('active')}render();tick();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
